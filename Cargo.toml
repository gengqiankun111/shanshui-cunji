[package]
name = "shanshui-cunji"
version = "0.6.0"
edition = "2021"
description = "山水存迹数据库（shanshui-cunji）：高性能海量文档数据库，LSM-Tree 高吞吐写入 + 倒排检索 + 文档模型 + 运维体系"
license = "Apache-2.0"
repository = ""

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
crossbeam-skiplist = "0.1"
zstd = "0.13"
lru = "0.18"
roaring = "0.10"
crc32fast = "1"
fst = "0.4"
memmap2 = "0.9"
# Ex-5.7（P23 决策）：只读 mmap 安全封装（独立 crate = unsafe 白名单），主库保持零 unsafe；
# 倒排 FST 字典按需加载（冷启动零堆分配，design 5.2.4.1）
mmap-file = { path = "crates/mmap-file" }
csv = "1"
# Ex-7.2（design_extension v0.5 第 12.2）：CPU 绑核（网络/计算/IO 三池物理核分区，
# 跳过超线程虚拟核由显式核列表配置；core_affinity 跨 Windows/Linux/macOS）
core_affinity = "0.8"
# Ex-6.2/6.3（design_extension v0.4 第 11 章）：原子指针发布（ArcSwap）——倒排段清单/FST
# 字典读路径拿 Arc 快照无锁（flush/gc 更新 rcu 发布；unsafe 在依赖内部，主库零 unsafe 不变）
arc-swap = "1"
mimalloc = { version = "0.1", default-features = false, optional = true }
parquet = "59.2.0"
arrow = "59.2.0"
jieba-rs = { version = "0.10", optional = true }

[[bin]]
name = "shanshui-cunji-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "shanshui-cunji-export"
path = "src/bin/export.rs"

[[bin]]
name = "shanshui-cunji-import"
path = "src/bin/import.rs"

[[bin]]
name = "shanshui-cunji-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "shanshui-cunji-ycsb"
path = "src/bin/ycsb.rs"

[[bin]]
name = "shanshui-cunji-gen-dataset"
path = "src/bin/gen_dataset.rs"

[features]
# 默认开启 mimalloc；`--no-default-features` 构建用系统分配器（压测对比基线）；
# `alloc-jemalloc` 切 tikv-jemallocator（mallctl purge/stats，Linux/musl 推荐）；
# `cjk-jieba` 开启 jieba 完整中文词典分词（~2-3.5MB 词典嵌入二进制，M8-P13）；
#   关闭时中文分词回退 bigram（M8-P9，零依赖）
default = ["alloc-mimalloc", "cjk-jieba"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]
cjk-jieba = ["dep:jieba-rs"]

[dependencies.tikv-jemallocator]
version = "0.5"
optional = true

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
lto = "fat"           # 链接时优化，提升性能、减小体积（编译时间更长）
codegen-units = 1     # 提高优化效果
strip = "symbols"     # 移除调试符号，大幅减小二进制体积
